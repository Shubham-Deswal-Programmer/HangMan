<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Hangman</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#11151a; --panel2:#171c22; --text:#f2f4f7;
    --muted:#8d96a3; --line:#252c35; --accent:#f2f4f7; --danger:#ff6670;
    --good:#66d19e; --key:#1a2027; --key-hover:#242c35;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex; justify-content:center; padding:24px 14px;
  }
  button,select{font:inherit}
  .app{width:min(900px,100%); display:flex; flex-direction:column; gap:16px}
  header{display:flex; align-items:center; justify-content:space-between; gap:12px}
  h1{font-size:20px; margin:0; letter-spacing:-.02em}
  .controls{display:flex; gap:8px; align-items:center}
  select,.ghost{
    color:var(--text); background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:9px 11px; outline:none;
  }
  .ghost{cursor:pointer}
  .ghost:hover{background:var(--panel2)}
  .stats{display:flex; gap:8px; color:var(--muted); font-size:13px}
  .stat{background:var(--panel); border:1px solid var(--line); padding:7px 10px; border-radius:9px}
  main{background:var(--panel); border:1px solid var(--line); border-radius:18px; overflow:hidden}
  .top{display:grid; grid-template-columns:1fr 1fr; min-height:300px}
  .visual{display:flex; align-items:center; justify-content:center; padding:26px}
  svg{width:min(330px,100%); height:auto}
  .draw{stroke:#e7ebef; stroke-width:5; stroke-linecap:round; fill:none}
  .part{opacity:0; transition:opacity .25s ease}
  .part.show{opacity:1}
  .game{padding:30px 30px 26px; display:flex; flex-direction:column; justify-content:center; border-left:1px solid var(--line)}
  .label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.13em}
  .hint{font-size:25px; font-weight:650; margin:8px 0 20px}
  .word{
    display:flex; flex-wrap:wrap; gap:9px; min-height:44px; align-items:flex-end;
    margin-bottom:16px;
  }
  .letter{
    width:28px; height:38px; border-bottom:2px solid #69727d;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:23px;
  }
  .letter.space{border:0;width:12px}
  .wrong{color:var(--muted); font-size:13px; min-height:20px}
  .keyboard{padding:20px; border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(13,1fr); gap:7px}
  .key{
    border:1px solid var(--line); background:var(--key); color:var(--text); border-radius:9px;
    height:42px; cursor:pointer; font-weight:650; transition:.12s;
  }
  .key:hover:not(:disabled){background:var(--key-hover); transform:translateY(-1px)}
  .key:disabled{cursor:default; opacity:.34}
  .key.correct{border-color:#438968; color:var(--good)}
  .key.incorrect{border-color:#73383e; color:var(--danger)}
  .bottom{display:flex; justify-content:space-between; align-items:center; gap:12px}
  .message{color:var(--muted); font-size:13px}
  .new{
    background:var(--text); color:#0b0d10; border:0; border-radius:10px;
    padding:10px 15px; font-weight:750; cursor:pointer;
  }
  .new:hover{opacity:.9}
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.72); display:none;
    align-items:center; justify-content:center; padding:20px; z-index:5;
  }
  .overlay.show{display:flex}
  .modal{
    width:min(380px,100%); background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:26px; text-align:center;
  }
  .modal h2{margin:0 0 8px; font-size:24px}
  .modal p{color:var(--muted); margin:0 0 20px}
  @media(max-width:680px){
    body{padding:12px}
    header{align-items:flex-start}
    .top{grid-template-columns:1fr; min-height:0}
    .visual{padding:12px 24px 0}
    .visual svg{width:230px}
    .game{border-left:0; border-top:0; padding:14px 20px 22px}
    .hint{font-size:21px; margin-bottom:16px}
    .keyboard{grid-template-columns:repeat(7,1fr); padding:14px; gap:6px}
    .key{height:44px}
    .bottom{align-items:flex-start}
    .stats{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Hangman</h1>
    <div class="controls">
      <div class="stats">
        <span class="stat">Wins <b id="wins">0</b></span>
        <span class="stat">Streak <b id="streak">0</b></span>
      </div>
      <select id="difficulty" aria-label="Difficulty">
        <option value="All">All</option>
        <option value="Easy">Easy</option>
        <option value="Medium">Medium</option>
        <option value="Hard">Hard</option>
      </select>
      <button class="ghost" id="newTop">New game</button>
    </div>
  </header>

  <main>
    <section class="top">
      <div class="visual">
        <svg viewBox="0 0 300 280" aria-label="Hangman drawing">
          <g class="draw">
            <line x1="42" y1="250" x2="225" y2="250"/>
            <line x1="78" y1="250" x2="78" y2="30"/>
            <line x1="78" y1="30" x2="205" y2="30"/>
            <line x1="205" y1="30" x2="205" y2="58"/>
          </g>
          <g id="parts">
            <circle class="draw part" data-part="1" cx="205" cy="84" r="26"/>
            <line class="draw part" data-part="2" x1="205" y1="110" x2="205" y2="178"/>
            <line class="draw part" data-part="3" x1="205" y1="127" x2="170" y2="154"/>
            <line class="draw part" data-part="4" x1="205" y1="127" x2="240" y2="154"/>
            <line class="draw part" data-part="5" x1="205" y1="178" x2="176" y2="220"/>
            <line class="draw part" data-part="6" x1="205" y1="178" x2="234" y2="220"/>
          </g>
        </svg>
      </div>

      <div class="game">
        <div class="label">Hint</div>
        <div class="hint" id="hint">—</div>
        <div class="label">Word</div>
        <div class="word" id="word"></div>
        <div class="wrong" id="wrong">Wrong guesses: 0 / 6</div>
      </div>
    </section>

    <div class="keyboard" id="keyboard"></div>
  </main>

  <div class="bottom">
    <div class="message" id="message">Choose a letter to begin.</div>
    <button class="new" id="newBottom">New game</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="resultTitle">You won!</h2>
    <p id="resultText"></p>
    <button class="new" id="resultButton">Play again</button>
  </div>
</div>

function updateStats(){
  $("wins").textContent = wins;
  $("streak").textContent = streak;
}

function pool(){
  const d = $("difficulty").value;
  return d === "All" ? WORDS : WORDS.filter(x => x.difficulty === d);
}

function newGame(){
  const list = pool();
  const item = list[Math.floor(Math.random() * list.length)];
  game = { ...item, guessed:new Set(), wrong:0, ended:false };
  $("hint").textContent = game.hint;
  $("message").textContent = "Choose a letter to begin.";
  $("overlay").classList.remove("show");
  document.querySelectorAll(".part").forEach(x => x.classList.remove("show"));
  renderWord();
  renderKeyboard();
  updateStats();
}

function renderWord(){
  const box = $("word");
  box.innerHTML = "";
  [...game.word].forEach(ch => {
    const el = document.createElement("div");
    if(ch === " "){
      el.className = "letter space";
      box.appendChild(el);
      return;
    }
    el.className = "letter";
    el.textContent = game.guessed.has(ch) ? ch : "";
    box.appendChild(el);
  });
  $("wrong").textContent = `Wrong guesses: ${game.wrong} / ${MAX_WRONG}`;
}

function renderKeyboard(){
  const kb = $("keyboard");
  kb.innerHTML = "";
  alphabet.forEach(ch => {
    const b = document.createElement("button");
    b.className = "key";
    b.textContent = ch;
    b.disabled = game.guessed.has(ch) || game.ended;
    if(game.guessed.has(ch)){
      b.classList.add(game.word.includes(ch) ? "correct" : "incorrect");
    }
    b.onclick = () => guess(ch);
    kb.appendChild(b);
  });
}

function guess(ch){
  if(game.ended || game.guessed.has(ch)) return;
  game.guessed.add(ch);

  if(!game.word.includes(ch)){
    game.wrong++;
    const part = document.querySelector(`.part[data-part="${game.wrong}"]`);
    if(part) part.classList.add("show");
  }

  renderWord();
  renderKeyboard();
  checkEnd();
}

function checkEnd(){
  const won = [...new Set(game.word.replace(/ /g,""))].every(ch => game.guessed.has(ch));
  if(won){
    game.ended = true;
    wins++;
    streak++;
    localStorage.setItem("hangmanWins", wins);
    localStorage.setItem("hangmanStreak", streak);
    $("message").textContent = "Nice one.";
    showResult(true);
  }else if(game.wrong >= MAX_WRONG){
    game.ended = true;
    streak = 0;
    localStorage.setItem("hangmanStreak", streak);
    $("message").textContent = "Game over.";
    showResult(false);
  }
}

function showResult(won){
  $("resultTitle").textContent = won ? "You won!" : "Game over";
  $("resultText").textContent = won
    ? `${game.word} · ${game.difficulty}`
    : `The word was ${game.word}.`;
  $("overlay").classList.add("show");
  renderKeyboard();
  updateStats();
}

document.addEventListener("keydown", e => {
  const ch = e.key.toUpperCase();
  if(alphabet.includes(ch)) guess(ch);
  if(e.key === "Enter" && game.ended) newGame();
});

$("difficulty").addEventListener("change", newGame);
$("newTop").onclick = newGame;
$("newBottom").onclick = newGame;
$("resultButton").onclick = newGame;

updateStats();
newGame();
</script>
</body>
</html>
